# A probe for Air Factory (AIRF-111): two jobs that fail on the first attempts of a workflow run and pass on a later rerun.
name: Factory rerun probe
on:
  workflow_dispatch:
    inputs:
      sleep:
        description: Seconds the slow job runs
        default: "0"
jobs:
  flaky-a:
    name: Flaky infra A
    runs-on: ubuntu-latest
    steps:
      - name: Fail on the first attempt
        run: |
          if [ "${{ github.run_attempt }}" -le 1 ]; then echo "infrastructure red"; exit 1; fi
  flaky-b:
    name: Flaky infra B
    runs-on: ubuntu-latest
    steps:
      - name: Fail on the first two attempts
        run: |
          if [ "${{ github.run_attempt }}" -le 2 ]; then echo "infrastructure red"; exit 1; fi
  slow:
    name: Slow job
    runs-on: ubuntu-latest
    steps:
      - name: Wait
        run: sleep "${{ inputs.sleep || '0' }}"
